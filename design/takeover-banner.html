<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mova · 接管横幅（按设计规范重做）</title>
<style>
  :root{
    /* Mova 设计规范 §3 的语义 token */
    --color-canvas:#181818;
    --color-sidebar:#141718;
    --color-surface:#1d2221;
    --color-surface-raised:#2c2e2e;
    --color-text:#d5d6d5;
    --color-text-strong:#f2f4f2;
    --color-text-muted:#828783;
    --color-border:#2b302d;
    --color-border-raised:#343b38;
    --color-focus:#8ca6a0;
    --color-primary-action:#3e5350;
    --color-primary-action-hover:#4d6763;
    --color-danger:#e0928c;
    --color-overlay-hover:#ffffff12;
    /* 新增：警告语义（设计规范里“成功/警告 待设计”，这里给出候选值） */
    --color-warning:#c9a86a;

    --radius-popover:12px;
    --radius-control:8px;
    --shadow-menu:0 20px 44px #0008;
    --ease-out:cubic-bezier(.22,.9,.26,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;gap:28px;
    background:radial-gradient(900px 600px at 50% 0%,#1b1f1f,#0d1011 70%);
    color:var(--color-text);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px;
  }
  .stage{display:flex;flex-direction:column;gap:8px}
  .stage > figcaption{font-size:11px;color:var(--color-text-muted);text-align:center}

  /* ── 假的浏览器面板（只为了让横幅有真实语境） ─────────────────── */
  .panel{
    position:relative;display:flex;flex-direction:column;
    border-radius:12px;overflow:hidden;
    background:var(--color-canvas);
    border:1px solid var(--color-border);
    box-shadow:0 30px 80px #000a;
  }
  .panel--wide{width:560px;height:320px}
  .panel--narrow{width:400px;height:320px}

  .bar{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;background:var(--color-sidebar);border-bottom:1px solid var(--color-border)}
  .bar i{width:8px;height:8px;border-radius:50%;background:#ffffff1f;display:block}
  .bar .url{
    flex:1;height:20px;border-radius:6px;background:#ffffff0d;
    display:flex;align-items:center;padding:0 8px;
    font-size:11px;color:var(--color-text-muted);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .page{flex:1;padding:14px;display:grid;gap:8px;align-content:start;background:#1b1b1b}
  .page b{font-size:12px;font-weight:600;color:#cfd3d2}
  .page .line{height:8px;border-radius:4px;background:#ffffff10}
  .page .line.w60{width:60%}
  .page .line.w80{width:80%}
  .page .field{height:24px;border-radius:6px;background:#ffffff0a;border:1px solid #ffffff0f}

  /* ── 接管横幅：本次重写的部分 ─────────────────────────────── */
  .browser-takeover{
    position:absolute;left:12px;right:12px;bottom:12px;z-index:21;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;
    padding:12px 14px;
    border:1px solid var(--color-border-raised);
    border-radius:var(--radius-popover);
    background:var(--color-surface);
    box-shadow:var(--shadow-menu);
    animation:takeover-in .2s var(--ease-out) both;
  }
  @keyframes takeover-in{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }

  .browser-takeover-copy{display:grid;gap:3px;min-width:0;flex:1 1 200px}
  .browser-takeover-copy strong{
    display:flex;align-items:center;gap:7px;
    font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--color-text-strong);
  }
  /* 状态点：唯一用到警告色的地方，不靠颜色单独表意（标题已写明“已暂停”） */
  .browser-takeover-copy strong::before{
    content:"";width:6px;height:6px;border-radius:50%;flex:none;
    background:var(--color-warning);box-shadow:0 0 0 3px #c9a86a29;
  }
  .browser-takeover-note{
    margin:0;font-size:12.5px;line-height:1.5;color:var(--color-text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;overflow-wrap:anywhere;
  }

  .browser-takeover-actions{display:flex;gap:8px;flex:none;margin-left:auto}
  .browser-takeover-actions button{
    height:28px;padding:0 12px;
    border:1px solid transparent;border-radius:var(--radius-control);
    font:500 12px/1 inherit;font-family:inherit;color:var(--color-text);
    background:transparent;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .browser-takeover-actions button:hover{background:var(--color-overlay-hover)}
  .browser-takeover-actions button:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
  /* 主操作：唯一有填充色的按钮 */
  .browser-takeover-actions [data-takeover-resume]{
    background:var(--color-primary-action);
    border-color:#4d6763;color:var(--color-text-strong);
  }
  .browser-takeover-actions [data-takeover-resume]:hover{
    background:var(--color-primary-action-hover);border-color:#5a7671;
  }
  /* 次要且带破坏性：只用危险色文字，不填色 */
  .browser-takeover-actions [data-takeover-cancel]{color:var(--color-danger)}
  .browser-takeover-actions [data-takeover-cancel]:hover{background:#e0928c14}

  @media (prefers-reduced-motion: reduce){
    .browser-takeover{animation:none}
  }
</style>
</head>
<body>
  <figure class="stage" style="margin:0">
    <div class="panel panel--wide">
      <div class="bar"><i></i><i></i><i></i><div class="url">shop.example.com/orders</div></div>
      <div class="page">
        <b>订单列表</b>
        <div class="line w80"></div>
        <div class="line w60"></div>
        <div class="field"></div>
        <div class="field"></div>
      </div>
      <div class="browser-takeover">
        <div class="browser-takeover-copy">
          <strong>Agent 已暂停</strong>
          <p class="browser-takeover-note">你正在操作浏览器，Agent 已让出控制权并停在当前这一步。处理完后点“我已处理，继续”，它会重新读取页面再往下走。</p>
        </div>
        <div class="browser-takeover-actions">
          <button type="button" data-takeover-resume>我已处理，继续</button>
          <button type="button" data-takeover-cancel>结束任务</button>
        </div>
      </div>
    </div>
    <figcaption>560px 宽：单行——文案在左，按钮右对齐</figcaption>
  </figure>

  <figure class="stage" style="margin:0">
    <div class="panel panel--narrow">
      <div class="bar"><i></i><i></i><i></i><div class="url">shop.example.com/orders</div></div>
      <div class="page">
        <b>订单列表</b>
        <div class="line w80"></div>
        <div class="field"></div>
      </div>
      <div class="browser-takeover">
        <div class="browser-takeover-copy">
          <strong>Agent 已暂停</strong>
          <p class="browser-takeover-note">你正在操作浏览器，Agent 已让出控制权并停在当前这一步。</p>
        </div>
        <div class="browser-takeover-actions">
          <button type="button" data-takeover-resume>我已处理，继续</button>
          <button type="button" data-takeover-cancel>结束任务</button>
        </div>
      </div>
    </div>
    <figcaption>400px 宽：放不下时按钮自动掉到第二行，仍右对齐</figcaption>
  </figure>
</body>
</html>
